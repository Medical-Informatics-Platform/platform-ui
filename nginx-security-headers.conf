# Security headers for the pages this nginx serves itself. Included per location: add_header at server level would
# also reach /services and JupyterHub, which set their own, and a location with its own add_header drops inherited ones.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $content_security_policy always;
