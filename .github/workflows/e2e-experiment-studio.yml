name: Experiment studio e2e

# Playwright flows for the experiment studio. Backend calls are mocked in the
# browser (every same-origin /services request). No live API and no secrets.
# Karma `npm test` stays out of CI; see .github/workflows/checks.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  experiment-studio:
    name: Playwright experiment studio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Experiment studio flows
        run: npm run e2e:experiment-studio
        env:
          CI: true
