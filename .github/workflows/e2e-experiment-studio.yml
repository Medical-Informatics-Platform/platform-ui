name: Experiment studio e2e

# Playwright flows in e2e/ (studio, dashboard, access). Backend calls are mocked in the
# browser (every same-origin /services request). No live API and no secrets.
# The Vitest unit tests run in unit-tests.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  experiment-studio:
    name: Playwright experiment studio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E flows
        run: npm run e2e
        env:
          CI: true

      # Traces and screenshots of failed tests only (see playwright.config.ts).
      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
