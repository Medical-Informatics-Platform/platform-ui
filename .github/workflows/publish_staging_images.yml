name: Publish staging images

on:
  push:
    branches: [staging-a, staging-b]
  workflow_dispatch:

concurrency: staging-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build PLATFORM-UI staging image and push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Compute staging tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          echo "tag=${REF_NAME}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Staging image tag: ${REF_NAME}-${short_sha}"

      - name: Output tag
        run: |
          echo "Tag output: ${{ steps.tag.outputs.tag }}"
