@if (tableSpec()) {
<div class="ar-container">
  @for (table of tableSpec(); track table) {
  <div class="ar-card" [class.ar-card--full]="!isCompactTable(table)" [class.ar-card--compact]="isCompactTable(table)">
    <div class="ar-header" data-guide="result-actions">
      <div class="ar-title">{{ table.title || 'Result Table' }}</div>
      <button type="button" class="ar-csv-link" (click)="exportToCSV(table)" title="Download table as CSV"
        [attr.aria-label]="'Download ' + (table.title || 'table') + ' as CSV'">CSV ↓</button>
    </div>

    <div class="ar-table-wrapper">
      <table class="ar-table">
        <thead>
          <tr>
            @for (col of table.columns; track col) {
            <th>{{ col }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of table.rows; track row) {
          <tr>
            @for (cell of row; track cell; let colIndex = $index) {
            <td
              [class.ar-role-factor]="table.columns[colIndex] === 'Role' && cell === 'Factor'"
              [class.ar-role-outcome]="table.columns[colIndex] === 'Role' && cell === 'Outcome'"
              [class.ar-cell-text]="table.columns[colIndex] === 'Role' || table.columns[colIndex] === 'Variable' || table.columns[colIndex] === 'Categories'">
              {{ formatValue(cell) }}
            </td>
            }
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
  }
</div>
}
