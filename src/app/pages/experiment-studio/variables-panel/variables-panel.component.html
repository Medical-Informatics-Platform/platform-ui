<div>
  <div class="selectors-row" id="dataset-selection"></div>

  <!-- Main area -->
  <div class="variables-main">
    <div class="visualization-parameters-row" data-guide="variables-section">
      <div class="bubble-column" data-guide="variable-browser">
        <section class="bubble-chart-section" id="data-model-visualization" data-guide="variable-selection" app-model-browser></section>
      </div>

      <aside class="right-column">
        <!-- Node details: chart + metadata -->
        <section class="panel-block histogram-panel" id="histogram-graph" data-guide="variable-details" app-variable-details-panel></section>

        <app-selected-variables
          mode="inline"
          data-guide="variable-containers"
          [selectedNode]="selection.selectedNode()"
          (variableClicked)="selection.pickPoolVariable($event)">
        </app-selected-variables>
      </aside>
    </div>

  </div>
</div>
