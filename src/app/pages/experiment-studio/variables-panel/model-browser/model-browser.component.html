<div class="visualization-toolbar">
  <div
    class="visualization-toolbar-section visualization-toolbar-context"
    #contextSection
    data-guide="study-context">
    <button
      type="button"
      class="study-context-chip"
      [attr.aria-expanded]="contextOpen()"
      [attr.title]="studyContextTitle()"
      (click)="toggleContext()">
      <span class="study-context-value">
        {{ catalog.selectedDataModel()?.label ?? 'Select pathology' }}
      </span>
      @if (catalog.selectedDataModel()) {
      <span class="study-context-sep" aria-hidden="true">·</span>
      <span class="study-context-count" [title]="studyContextTitle()">
        <i class="fas fa-hospital" aria-hidden="true"></i>
        <span>{{ catalog.selectedDatasetCount() }} dataset{{ catalog.selectedDatasetCount() === 1 ? '' : 's' }}</span>
      </span>
      }
      <i class="fas fa-chevron-down study-context-chevron" aria-hidden="true"></i>
    </button>
    @if (contextOpen()) {
    <div class="study-context-panel" role="region" aria-label="Study context settings">
      <app-data-model-selector [crossSectionalModels]="catalog.crossSectionalModels()"
        [longitudinalModels]="catalog.longitudinalModels()" [defaultModel]="catalog.selectedDataModel()"
        (dataModelChange)="onDataModelChange($event)">
      </app-data-model-selector>

      <div class="study-context-divider" aria-hidden="true"></div>

      <app-dataset-selector
        [datasets]="catalog.availableDatasets()"
        [selectedDatasetCodes]="catalog.selectedDatasets()">
      </app-dataset-selector>
    </div>
    }
  </div>

  @if (catalog.hierarchy()) {
  <div class="visualization-toolbar-modes">
    <div
      class="metadata-browser-switcher"
      role="group"
      aria-label="Metadata browser view"
      [style.--segment-active-index]="metadataBrowserModeIndex()">
      <span class="metadata-segment-track" aria-hidden="true">
        <span class="metadata-segment-indicator"></span>
      </span>
      @for (mode of metadataBrowserModes; track mode.value) {
      <button
        type="button"
        class="metadata-mode-btn"
        [class.active]="metadataBrowserMode() === mode.value"
        [attr.aria-pressed]="metadataBrowserMode() === mode.value"
        [attr.aria-label]="mode.label"
        [title]="mode.title"
        (click)="setMetadataBrowserMode(mode.value)"
      >
        <i [class]="mode.icon" aria-hidden="true"></i>
        <span>{{ mode.label }}</span>
      </button>
      }
    </div>
  </div>

  <div
    class="visualization-toolbar-section visualization-toolbar-search"
    #searchSection
    data-guide="search-bar"
    [class.is-open]="searchExpanded()">
    <button
      type="button"
      class="search-toggle-btn"
      [class.is-active]="searchExpanded()"
      [attr.aria-expanded]="searchExpanded()"
      [title]="searchExpanded() ? 'Close search' : 'Search variables or groups'"
      aria-label="Search variables or groups"
      (click)="toggleSearch()">
      <i class="fas fa-search" aria-hidden="true"></i>
      <span>Search variables</span>
    </button>
    @if (searchExpanded()) {
    <div class="search-popover">
      <app-search-bar [dataModelHierarchy]="catalog.hierarchy()" [unavailableVariables]="catalog.unavailableVariables()" (searchResultSelected)="onSearchSelected($event)">
      </app-search-bar>
    </div>
    }
  </div>
  }
</div>

@if (catalog.selectedDataModel() && catalog.hierarchy()) {
<div
  class="metadata-browser-shell"
  [class.is-map]="metadataBrowserMode() === 'bubble'"
  data-guide="variable-visualizations">
  <div class="metadata-browser-content">
    @switch (metadataBrowserMode()) {
      @case ('ontology') {
      <app-ontology-tree-browser
        [data]="catalog.hierarchy()"
        [highlightNode]="selection.highlightNode()"
        [poolVariables]="catalog.selectedVariables()"
        [unavailableVariables]="catalog.unavailableVariables()"
        (selectedNodeChange)="selection.pickInBrowser($event)"
        (nodeDoubleClicked)="selection.pickAndAdd($event)"
        (variablePoolToggle)="selection.togglePool()">
      </app-ontology-tree-browser>
      }
      @case ('collapsible') {
      <app-collapsible-tree-browser
        [data]="catalog.hierarchy()"
        [highlightNode]="selection.highlightNode()"
        [selectedVariables]="catalog.selectedVariables()"
        [unavailableVariables]="catalog.unavailableVariables()"
        (selectedNodeChange)="selection.pickInBrowser($event)"
        (nodeDoubleClicked)="selection.pickAndAdd($event)">
      </app-collapsible-tree-browser>
      }
      @default {
      <app-bubble-chart
        [d3Data]="catalog.hierarchy()"
        [highlightNode]="selection.highlightNode()"
        [selectedVariables]="catalog.selectedVariables()"
        [unavailableVariables]="catalog.unavailableVariables()"
        (selectedNodeChange)="selection.pickInMap($event)"
        (nodeDoubleClicked)="selection.pickAndAdd($event)">
      </app-bubble-chart>
      }
    }
  </div>
</div>
}
