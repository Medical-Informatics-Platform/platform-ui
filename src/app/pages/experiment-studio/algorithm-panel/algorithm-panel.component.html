<div class="experiment-container experiment-container--setup" data-guide="experiment-workspace">

@if (assignablePool().length > 0) {
<section app-algorithm-selection class="algorithm-roles-board algorithm-studio-card" aria-label="Algorithm selection workspace">
  <div app-experiment-result class="algorithm-run-bar" role="status"></div>
</section>
} @else {
<section class="algorithm-panel-empty" aria-label="Algorithm configuration placeholder">
  <h5 class="algorithm-panel-empty__title">Select variables first</h5>
  <p class="algorithm-panel-empty__text">
    Add variables on Datasets &amp; Variables, then assign an outcome (y) and predictors (x) here.
  </p>
</section>
}
</div>
