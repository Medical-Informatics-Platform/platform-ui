<h5 class="tooltip-title">{{ algorithm()?.label }}</h5>
<div class="tooltip-description" [innerHTML]="algorithm()?.description"></div>

@if (details().length) {
<div class="tooltip-requirements">
  <div class="tooltip-requirements-header">Availability</div>
  @for (detail of details(); track detail.role) {
  <div class="req-item" [class.req-item--failed]="detail.messages.length > 0">
    <div class="req-copy">
      <span class="req-text">{{ availabilityRequirementText(detail) }}</span>
      @for (message of detail.messages; track message) {
      <span class="req-error">{{ message }}</span>
      }
    </div>
  </div>
  }
</div>
}
